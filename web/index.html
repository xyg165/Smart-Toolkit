<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>filekit · 文件整理工具</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1f2328; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#eff4ff; --warn:#b45309; --warn-soft:#fff7ed;
    --ok:#15803d; --ok-soft:#f0fdf4; --danger:#b91c1c; --danger-soft:#fef2f2;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12px}
  header .spacer{flex:1}
  .env{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);border:1px solid #bbf7d0}
  .env.bad{background:var(--warn-soft);color:var(--warn);border-color:#fed7aa;cursor:help}
  .ver{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
  main{max-width:1180px;margin:0 auto;padding:20px 22px 60px}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;color:var(--muted)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card h2 .n{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--text)}
  button:hover{border-color:#c9ced6}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  button.primary:hover{background:#1d4ed8}
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 8px}
  button.ghost:hover{color:var(--danger)}
  input[type=text]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
  label.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer}
  .folders{list-style:none;margin:0;padding:0}
  .folders li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fcfcfd}
  .folders li .path{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}
  .empty{color:var(--muted);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:12px;background:#fafbfc}
  td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
  .edit-name{width:100%;font:12px ui-monospace,Menlo,Consolas,monospace;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text)}
  .edit-name:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .edit-name.changed{border-color:var(--accent);background:var(--accent-soft);font-weight:500}
  tr.uncat td{background:#fffdf5}
  .hint-inline{font-size:12px;color:var(--muted);font-weight:400}
  .arrow{color:var(--accent)}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;background:var(--accent-soft);color:var(--accent)}
  .badge.gray{background:#f3f4f6;color:var(--muted)}
  .note{font-size:12.5px;color:var(--muted);margin-top:8px}
  .alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px}
  .alert.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #fed7aa}
  .alert.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bbf7d0}
  .alert.err{background:var(--danger-soft);color:var(--danger);border:1px solid #fecaca}
  .modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:12px;width:min(720px,100%);max-height:78vh;display:flex;flex-direction:column;overflow:hidden}
  .modal .head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .head .p{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted);word-break:break-all}
  .modal .body{overflow:auto;padding:6px 0}
  .dirlist{list-style:none;margin:0;padding:0}
  .dirlist li{padding:9px 18px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px}
  .dirlist li:hover{background:var(--accent-soft)}
  .dirlist li.file{cursor:default;color:#9ca3af}
  .dirlist li.file:hover{background:transparent}
  .dirlist li.empty-item{cursor:default;color:#9ca3af;justify-content:center}
  .dirlist li.summary{cursor:default;color:var(--muted);font-size:12px;background:#fafbfc;border-top:1px solid var(--line)}
  .dirlist li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dirlist li .tag{font-size:11.5px;color:#9ca3af;flex:none}
  .modal .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hist-group{border:1px solid var(--line);border-radius:9px;margin-bottom:12px;overflow:hidden}
  .hist-head{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fafbfc;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
  .hist-time{font-family:ui-monospace,Menlo,Consolas,monospace}
  .hist-dir{flex:1;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;min-width:140px}
  .hist-group table{margin:0}
  .hist-group td,.hist-group th{padding:6px 9px}
  button.mini{padding:3px 10px;font-size:12px;border-radius:6px}
  .batch-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px;padding:9px 12px;background:var(--warn-soft);border:1px solid #fed7aa;border-radius:8px;font-size:13px}
  .batch-bar input{font:13px ui-monospace,Menlo,Consolas,monospace;padding:5px 9px;border:1px solid #fed7aa;border-radius:6px;background:#fff}
  .update-bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);background:#1f2328;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 28px rgba(0,0,0,.2);transition:transform .25s ease;z-index:100;max-width:92vw;flex-wrap:wrap}
  .update-bar.show{transform:translateX(-50%) translateY(0)}
  .update-bar button{background:#fff;color:#1f2328;border:none;padding:5px 11px;border-radius:6px;cursor:pointer;font:inherit;font-size:12.5px}
  .update-bar button.primary{background:var(--accent);color:#fff}
  .update-bar a{color:#93c5fd}
  .sum{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .sum b{color:var(--text)}
</style>
</head>
<body>
<header>
  <h1>filekit</h1>
  <span class="sub">本地文件整理 · 重命名 + 内容归类</span>
  <span class="spacer"></span>
  <span class="ver" id="ver">v…</span>
  <span class="env" id="env">检查中…</span>
</header>

<main>
  <div class="card">
    <h2><span class="n">1</span>选择文件夹<span class="note" style="font-weight:400">（可批量）</span></h2>
    <div class="row" style="margin-bottom:10px">
      <button class="primary" id="btn-add">＋ 添加文件夹</button>
      <button id="btn-add-manual">手动输入路径</button>
    </div>
    <ul class="folders" id="folder-list"></ul>
  </div>

  <div class="card">
    <h2><span class="n">2</span>处理方式</h2>
    <div class="row" style="margin-bottom:10px">
      <label class="chk"><input type="radio" name="mode" value="auto" checked> 智能 <span style="color:#9ca3af">能读内容就归类，否则只按文件名</span></label>
      <label class="chk"><input type="radio" name="mode" value="classify"> 内容归类</label>
      <label class="chk"><input type="radio" name="mode" value="rename"> 只按文件名</label>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="opt-date" checked> 加时间戳 YYMMDDHHMM</label>
      <label class="chk"><input type="checkbox" id="opt-pad"> 数字补零（头像1→头像01）</label>
      <label class="chk"><input type="checkbox" id="opt-lower"> 转小写</label>
    </div>
  </div>

  <div class="card">
    <h2><span class="n">3</span>预览并执行</h2>
    <div id="preview-alert"></div>
    <div class="row">
      <button class="primary" id="btn-preview">预览</button>
      <button id="btn-apply" disabled>确认执行</button>
    </div>
    <div id="batch-bar" class="batch-bar" hidden>
      <span>未分类 <b id="batch-n">0</b> 个，统一填成</span>
      <input type="text" id="batch-cat" placeholder="如：技术文档 / 投稿记录" list="cat-suggest" style="width:210px">
      <datalist id="cat-suggest"></datalist>
      <button class="mini" id="btn-batch-fill">一键填入</button>
      <span class="note" style="margin-left:4px">（只改新文件名里「未分类」那段）</span>
    </div>
    <div id="preview-out"></div>
  </div>

  <div class="card">
    <h2><span class="n">4</span>执行记录<span class="note" style="font-weight:400">（每条记录可整批回退，每个文件也可单独回退）</span></h2>
    <div class="row" style="margin-bottom:10px">
      <button id="btn-reload-history">刷新</button>
    </div>
    <div id="history-out"><div class="empty">加载中…</div></div>
  </div>
</main>

<!-- 目录浏览器 -->
<div class="modal" id="modal">
  <div class="box">
    <div class="head">
      <button class="ghost" id="m-up" title="上一级">⬆</button>
      <span class="p" id="m-path">/</span>
      <button class="ghost" id="m-home" title="主目录">🏠</button>
    </div>
    <div class="body"><ul class="dirlist" id="m-list"></ul></div>
    <div class="foot">
      <button id="m-cancel">取消</button>
      <button class="primary" id="m-choose">选择当前文件夹</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let dirs = [];          // 已选文件夹
let curPath = '';       // 浏览器当前目录
let rbDir = '';         // 回退目标文件夹
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 环境检查 ---------- */
(async () => {
  try{
    const r = await fetch('/api/env').then(r=>r.json());
    const el = $('#env');
    if(r.version){ CURRENT_VERSION = r.version; $('#ver').textContent = 'v' + r.version; }
    if(r.upstream && r.version && r.upstream !== r.version){
      showUpdateBar(`🆕 上游已有新版本 <b>v${esc(r.upstream)}</b>（当前 v${esc(r.version)}）`
        + `　<a href="https://github.com/xyg165/Smart-Toolkit" target="_blank">查看更新</a>`
        + `　<button onclick="this.parentNode.classList.remove('show')">知道了</button>`);
    }
    if(r.ok){ el.textContent='✅ 环境就绪'; }
    else{
      el.className='env bad';
      el.textContent=`⚠ 缺 ${r.missing.length} 项依赖（悬停查看）`;
      el.title = r.missing.map(m=>`${m.name}\n装法：${m.how}`).join('\n\n');
    }
  }catch(e){ $('#env').textContent='—'; }
})();

/* ---------- 目录浏览器 ---------- */
function fmtSize(n){
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if(n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}
const MAX_SHOW = 400;

async function openBrowser(path, onChoose){
  const d = await fetch('/api/browse?path='+encodeURIComponent(path||'')).then(r=>r.json());
  if(d.error){ alert(d.error); return; }
  curPath = d.path;
  $('#m-path').textContent = d.path;
  const ul = $('#m-list');
  ul.innerHTML = '';
  const dirs = d.dirs || [], files = d.files || [];

  if(!dirs.length && !files.length){
    const li = document.createElement('li');
    li.className = 'empty-item';
    li.textContent = '（这个文件夹是空的）';
    ul.appendChild(li);
  }

  // ① 子文件夹（可点进去）
  dirs.forEach(x=>{
    const li = document.createElement('li');
    li.innerHTML = `<span>📁</span><span class="nm">${esc(x.name)}</span><span class="tag">文件夹</span>`;
    li.onclick = () => openBrowser(x.path, onChoose);
    ul.appendChild(li);
  });

  // ② 文件（全部列出 —— 让你知道这个文件夹里有什么可整理的）
  files.slice(0, MAX_SHOW).forEach(f=>{
    const li = document.createElement('li');
    li.className = 'file';
    li.innerHTML = `<span>📄</span><span class="nm">${esc(f.name)}</span><span class="tag">${fmtSize(f.size)}</span>`;
    ul.appendChild(li);
  });
  if(files.length > MAX_SHOW){
    const li = document.createElement('li');
    li.className = 'empty-item';
    li.textContent = `（还有 ${files.length - MAX_SHOW} 个文件未显示…）`;
    ul.appendChild(li);
  }

  // ③ 汇总
  const li = document.createElement('li');
  li.className = 'summary';
  li.textContent = `本文件夹：${dirs.length} 个子文件夹、${files.length} 个文件`
    + (files.length ? ' —— 选中后可整理这里所有文件' : '');
  ul.appendChild(li);

  $('#modal').classList.add('show');
  $('#m-choose').onclick = () => { $('#modal').classList.remove('show'); onChoose(curPath); };
}
$('#m-up').onclick = () => openBrowser(curPath.replace(/[\\/][^\\/]*$/,'') || curPath, window._onChoose);
$('#m-home').onclick = () => openBrowser('', window._onChoose);
$('#m-cancel').onclick = () => $('#modal').classList.remove('show');

$('#btn-add').onclick = () => { window._onChoose = p => { if(!dirs.includes(p)){ dirs.push(p); renderFolders(); } }; openBrowser('', window._onChoose); };
$('#btn-add-manual').onclick = () => {
  const p = prompt('请输入文件夹完整路径：', curPath || '');
  if(p && p.trim()){ const v=p.trim(); if(!dirs.includes(v)){ dirs.push(v); renderFolders(); } }
};

function renderFolders(){
  const ul = $('#folder-list');
  if(!dirs.length){ ul.innerHTML = '<div class="empty">还没有选择文件夹</div>'; return; }
  ul.innerHTML = '';
  dirs.forEach((d,i)=>{
    const li = document.createElement('li');
    li.innerHTML = `<span>📁</span><span class="path">${esc(d)}</span>`;
    const b = document.createElement('button');
    b.className='ghost'; b.textContent='移除';
    b.onclick = () => { dirs.splice(i,1); renderFolders(); };
    li.appendChild(b);
    ul.appendChild(li);
  });
}

/* ---------- 预览 / 执行 ---------- */
function getOpts(){
  return {
    sep:'_',
    add_date: $('#opt-date').checked,
    pad: $('#opt-pad').checked,
    lower: $('#opt-lower').checked
  };
}
const getMode = () => document.querySelector('input[name=mode]:checked').value;

$('#btn-preview').onclick = async () => {
  if(!dirs.length) return alert('请先添加文件夹');
  $('#preview-alert').innerHTML = '';
  $('#preview-out').innerHTML = '<div class="note">正在读取…</div>';
  const res = await fetch('/api/preview', {method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({dirs, mode:getMode(), opts:getOpts()})}).then(r=>r.json());
  let total = 0, html = '';
  res.forEach(g=>{
    if(!g.ok){ html += `<div class="alert err">${esc(g.dir)}：${esc(g.error)}</div>`; return; }
    total += g.count;
    const skipTip = (g.skipped && g.skipped.length)
      ? `<span style="color:#9ca3af"> · 已跳过 ${g.skipped.length} 个源码/配置文件</span>` : '';
    html += `<div style="margin-top:14px"><div class="note"><b>${esc(g.dir)}</b> — ${g.count} 个待处理${skipTip}</div>`;
    if(!g.count){ html += '</div>'; return; }
    html += '<table><thead><tr><th style="width:44%">原文件名</th><th style="width:44%">新文件名</th><th>识别</th></tr></thead><tbody>';
    g.items.slice(0,300).forEach(it=>{
      const uncat = (!it.cat || it.cat === '未分类');
      const badge = it.cat ? `<span class="badge${uncat?' gray':''}">${esc(it.cat)}</span>` : '';
      html += `<tr${uncat?' class="uncat"':''}>`
        + `<td class="mono">${esc(it.old)}</td>`
        + `<td><input class="edit-name" data-dir="${esc(g.dir)}" data-old="${esc(it.old)}" `
        + `data-cat="${esc(it.cat||'')}" data-uncat="${uncat?1:0}" value="${esc(it.new)}"></td>`
        + `<td>${badge}</td></tr>`;
    });
    html += '</tbody></table>';
    if(g.items.length>300) html += `<div class="note">仅显示前 300 条，共 ${g.items.length} 条</div>`;
    html += '</div>';
  });
  $('#preview-out').innerHTML = html || '<div class="empty">没有需要处理的文件</div>';
  // 绑定：编辑新文件名时高亮
  document.querySelectorAll('.edit-name').forEach(inp=>{
    inp.addEventListener('input', () => {
      inp.classList.toggle('changed', inp.value !== inp.defaultValue);
    });
  });
  // 未分类统计 + 类别建议下拉
  const uncats = document.querySelectorAll('.edit-name[data-uncat="1"]');
  $('#batch-n').textContent = uncats.length;
  $('#batch-bar').hidden = uncats.length === 0;
  const cats = new Set();
  document.querySelectorAll('.edit-name').forEach(i => { if(i.dataset.cat) cats.add(i.dataset.cat); });
  ['技术文档','合同','方案','内容脚本','运营数据','财务报表','会议纪要','投稿记录','素材清单','说明书']
    .forEach(c => cats.add(c));
  $('#cat-suggest').innerHTML = [...cats].map(c => `<option value="${esc(c)}">`).join('');
  $('#btn-apply').disabled = total === 0;
  $('#preview-alert').innerHTML = total
    ? `<div class="alert ok">共 <b>${total}</b> 个文件待处理。`
      + `新文件名<b>可直接在表格里修改</b>（尤其「未分类」的），改完再点「确认执行」。`
      + '<div class="hint-inline" style="margin-top:4px">黄色底的行 = 没认出类别，建议手工补一个分类词。</div></div>'
    : '<div class="alert warn">没有需要处理的文件</div>';
};

function collectGroups(){
  const map = {};
  document.querySelectorAll('.edit-name').forEach(inp=>{
    const d = inp.dataset.dir;
    (map[d] = map[d] || []).push({old: inp.dataset.old, new: inp.value.trim(), cat: inp.dataset.cat});
  });
  return Object.entries(map).map(([dir, items]) => ({dir, items}));
}

$('#btn-apply').onclick = async () => {
  const groups = collectGroups();
  const edited = document.querySelectorAll('.edit-name.changed').length;
  const msg = '确认执行重命名？' + (edited ? `\n\n（其中 ${edited} 个文件名被你手工改过）` : '')
            + '\n\n执行后会生成日志，可在「回退」页还原。';
  if(!confirm(msg)) return;
  const btn = $('#btn-apply'); btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> 执行中';
  const r = await fetch('/api/apply', {method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({dirs, mode:getMode(), opts:getOpts(), groups})}).then(r=>r.json());
  btn.innerHTML = '确认执行';
  if(r.ok){
    $('#preview-alert').innerHTML = `<div class="alert ok">✅ 完成：共重命名 <b>${r.renamed}</b> 个文件。如需还原，请到「回退」页。</div>`;
    $('#preview-out').innerHTML = '';
  }else{
    $('#preview-alert').innerHTML = `<div class="alert err">❌ ${esc(r.error)}</div>`;
    btn.disabled = false;
  }
};

/* ============================================================
   执行记录：列出每次执行，支持单文件回退为原名
   ============================================================ */
async function loadHistory(){
  $('#history-out').innerHTML = '<div class="note">读取中…</div>';
  let r;
  try{ r = await fetch('/api/history').then(x=>x.json()); }
  catch(e){ $('#history-out').innerHTML = '<div class="alert err">读取失败</div>'; return; }
  const recs = r.records || [];
  window._hist = recs;
  if(!recs.length){
    $('#history-out').innerHTML = '<div class="empty">还没有执行记录<br><span style="font-size:12px">去「整理文件」页执行一次，这里就会出现</span></div>';
    return;
  }
  let html = '';
  recs.forEach((rec, ri) => {
    const t = (rec.time || '').replace('T', ' ');
    const canAll = (rec.items || []).filter(x => x.can_rollback).length > 0;
    html += '<div class="hist-group">';
    html += '<div class="hist-head">'
          + `<span class="hist-time">${esc(t)}</span>`
          + `<span class="hist-dir" title="${esc(rec.dir)}">${esc(rec.dir)}</span>`
          + `<span class="badge gray">${(rec.items||[]).length} 个文件</span>`
          + (rec.exists ? '' : '<span class="badge gray">日志已丢失</span>')
          + '<span style="flex:1"></span>'
          + (canAll ? `<button class="mini" onclick="rollbackAll(${ri})">整批回退</button>` : '')
          + '</div>';
    if(rec.items && rec.items.length){
      html += '<table><thead><tr><th style="width:32%">原文件名</th><th style="width:32%">现文件名</th>'
            + '<th style="width:14%">识别</th><th style="width:130px">操作</th></tr></thead><tbody>';
      rec.items.forEach((it, ii) => {
        const cat = it.cat ? `<span class="badge${it.cat === '未分类' ? ' gray' : ''}">${esc(it.cat)}</span>` : '';
        let action;
        if(it.rolled_back) action = '<span class="badge gray">已回退</span>';
        else if(it.can_rollback) action = `<button class="mini" onclick="rollbackOne(${ri},${ii})">回退</button>`;
        else action = '<span class="note" style="font-size:11.5px">文件已变动</span>';
        html += `<tr><td class="mono">${esc(it.old)}</td><td class="mono">${esc(it.new)}</td>`
              + `<td>${cat}</td><td>${action}</td></tr>`;
      });
      html += '</tbody></table>';
    }
    html += '</div>';
  });
  $('#history-out').innerHTML = html;
}

window.rollbackOne = async (ri, ii) => {
  const rec = window._hist[ri], it = rec.items[ii];
  if(!confirm('把这个文件单独回退为原名？\n\n' + it.new + '\n   ↓\n' + it.old)) return;
  const r = await fetch('/api/rollback_one', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({logfile: rec.log, old: it.old})
  }).then(x=>x.json());
  if(r.ok){ await loadHistory(); }
  else{ alert('❌ ' + r.error); }
};

window.rollbackAll = async (ri) => {
  const rec = window._hist[ri];
  const n = rec.items.filter(x => x.can_rollback).length;
  if(!confirm(`整批回退这条记录的 ${n} 个文件？\n\n文件夹：${rec.dir}`)) return;
  const r = await fetch('/api/rollback', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({logfile: rec.log})
  }).then(x=>x.json());
  if(r.ok){ await loadHistory(); }
  else{ alert('❌ ' + (r.error || '回退失败')); }
};

$('#btn-batch-fill').onclick = () => {
  const cat = ($('#batch-cat').value || '').trim();
  if(!cat) return alert('先填一个类别名，比如「技术文档」');
  if(/[\\/:*?"<>|]/.test(cat)) return alert('类别名不能含 \\ / : * ? " < > |');
  let n = 0;
  document.querySelectorAll('.edit-name[data-uncat="1"]').forEach(inp => {
    const cur = inp.value;
    let nv;
    if(cur.includes('_未分类_')) nv = cur.replace('_未分类_', '_' + cat + '_');
    else if(/^[A-Z]+_/.test(cur)) nv = cur.replace(/^([A-Z]+)_/, '$1_' + cat + '_');
    else nv = cat + '_' + cur;
    inp.value = nv;
    inp.classList.toggle('changed', nv !== inp.defaultValue);
    inp.dataset.uncat = '0';
    n++;
  });
  const left = document.querySelectorAll('.edit-name[data-uncat="1"]').length;
  $('#batch-n').textContent = left;
  $('#batch-bar').hidden = left === 0;
  alert(`已把 ${n} 个文件填成「${cat}」`);
};

$('#btn-reload-history').onclick = loadHistory;

/* ============================================================
   热更新：服务端通过 SSE 推「有更新」，页面自动刷新或提示重启
   ============================================================ */
function showUpdateBar(html){
  let bar = document.getElementById('update-bar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'update-bar';
    bar.className = 'update-bar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = html;
  bar.classList.add('show');
}

const REPO_URL = 'https://github.com/xyg165/Smart-Toolkit';
let CURRENT_VERSION = '';

function connectSSE(){
  try{
    const es = new EventSource('/api/events');
    es.onmessage = (e) => {
      let d; try{ d = JSON.parse(e.data); }catch(_){ return; }

      if(d.event === 'changed'){
        if(d.need_restart){
          showUpdateBar(`🔄 检测到后端代码更新（${esc(d.files.join('、'))}）`
            + `　<button class="primary" onclick="doRestart()">立即重启服务</button>`
            + `　<button onclick="location.reload()">仅刷新页面</button>`);
        }else{
          const dirty = document.querySelectorAll('.edit-name.changed').length;
          if(dirty){
            showUpdateBar(`🔄 界面已更新，但你有 ${dirty} 处未提交的改名`
              + `　<button class="primary" onclick="location.reload()">丢弃并刷新</button>`);
          }else{
            showUpdateBar(`🔄 界面已更新，3 秒后自动刷新…`
              + `　<button class="primary" onclick="location.reload()">立即刷新</button>`);
            setTimeout(() => location.reload(), 3000);
          }
        }
      }
      else if(d.event === 'upstream'){
        if(d.version && d.version !== CURRENT_VERSION){
          showUpdateBar(`🆕 上游已有新版本 <b>v${esc(d.version)}</b>（当前 v${esc(CURRENT_VERSION)}）`
            + `　<a href="${REPO_URL}" target="_blank">查看更新</a>`
            + `　<button onclick="this.parentNode.classList.remove('show')">知道了</button>`);
        }
      }
    };
    es.onerror = () => { /* EventSource 会自动重连，不用管 */ };
  }catch(e){}
}

window.doRestart = async () => {
  if(!confirm('重启服务以加载新代码？\n\n重启期间页面会短暂断开，之后自动恢复。')) return;
  showUpdateBar('⏳ 正在重启服务，请稍候…');
  try{ await fetch('/api/restart'); }catch(e){}
  setTimeout(() => location.reload(), 2600);
};

connectSSE();
renderFolders();
loadHistory();
